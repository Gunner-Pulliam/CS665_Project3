{% extends "base.html" %}

{% block content %}
<h1>{% if student %}Edit Student{% else %}Add Student{% endif %}</h1>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">First Name</label>
        <input name="first_name" class="form-control" value="{{ student.first_name if student else '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input name="last_name" class="form-control" value="{{ student.last_name if student else '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input name="email" class="form-control" value="{{ student.email if student else '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Enrollment Date</label>
        <input type="date" name="enrollment_date" class="form-control" value="{{ student.enrollment_date if student else '' }}">
    </div>

    <button class="btn btn-success">Save</button>
    <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
