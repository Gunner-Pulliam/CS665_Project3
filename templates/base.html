<!DOCTYPE html>
<html>
<head>
    <title>Student Course Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">Student Course Manager</a>
        <div>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('students') }}">Students</a>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('courses') }}">Courses</a>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('enrollments') }}">Enrollments</a>
        </div>
    </div>
</nav>

<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>
</body>
</html>
