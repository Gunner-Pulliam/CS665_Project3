{% extends "base.html" %}

{% block content %}
<h1>{% if course %}Edit Course{% else %}Add Course{% endif %}</h1>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Course Name</label>
        <input 
            type="text"
            name="course_name"
            class="form-control"
            value="{{ course.course_name if course else '' }}"
            required
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Credits</label>
        <input 
            type="number"
            name="credits"
            class="form-control"
            min="1"
            value="{{ course.credits if course else '' }}"
            required
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Instructor</label>
        <select name="instructor_id" class="form-select" required>
            <option value="">Select an instructor</option>

            {% for instructor in instructors %}
                <option 
                    value="{{ instructor.instructor_id }}"
                    {% if course and course.instructor_id == instructor.instructor_id %}selected{% endif %}
                >
                    {{ instructor.instructor_name }} - {{ instructor.department }}
                </option>
            {% endfor %}
        </select>
    </div>

    <button class="btn btn-success">Save</button>
    <a href="{{ url_for('courses') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
